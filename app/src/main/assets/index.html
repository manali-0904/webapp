<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>सुवर्णकार डायरी</title>
</head>
<body>
<header>
    <h1>सुवर्णकार डायरी</h1>
</header>
<div class="container">
    <button class="openbtn" onclick="toggleSidebar()">☰</button>

    <!-- Sidebar Section -->
    <aside class="sidebar" id="sidebar">
        <ul>
            <li><a href="index.html"><i class="fas fa-home"></i> सुवर्णकार डायरी</a></li>
            <li><a href="Customers.html"><i class="fa-solid fa-users"></i>व्यापारी</a></li>
            <li><a href="savegold.html"><i class="fas fa-store"></i> जमा सोने </a></li>
            <li><a href="pending gold.html"><i class="fas fa-hand-holding-usd"></i> सोने येणे बाकी </a></li>
            <li><a href="pending money.html"><i class="fas fa-cash-register"></i> पैसे येणे बाकी </a></li>
        </ul>
    </aside>

    <!-- Main Content Section -->
    <main class="main-content">
        <div class="content-wrapper">
            <div class="forms-container">
                <button id="toggleForm" class="btn btn-primary">
                    <img src="img/form.png" alt="Logo" width="200" height="100">
                </button>
                <h6 style="margin-top:120px;">+ नवीन ऑर्डर</h6>
                <!-- Modal Structure for New Order -->
                <div id="formModal" class="modal">
                    <div class="modal-content">
                        <span class="close" id="closeModal">&times;</span>
                        <form id="orderForm">
                            <h2>+ नवीन ऑर्डर</h2>
                            <label for="date">तारीख:</label>
                            <input type="date" id="date" name="date" placeholder="dd-mm-yyyy" writingsuggestions="true" required>
                            <br>
                            <label for="name">व्यापार्याचे नाव:</label>
                            <input type="text" id="name" name="name" writingsuggestions="true" required>
                            <datalist id="clientNames"></datalist>
                            <br><br>
                            <label for="Ornament">दागिना:</label>
                            <select name="Ornament" id="Ornament" onchange="updateStyleOptions()">
                                <option value="" disabled selected>Select type</option>
                                <option value="Beeds">मणी</option>
                                <option value="Ear piercing">कानातले</option>
                                <option value="Neck jewel">गळ्यातल</option>
                                <option value="Ring">अंगठी</option>
                                <option value="Wrist jewel">हातातले</option>
                                <option value="Ankle jewel">पायातले</option>
                                <option value="Waist jewel">कमरेतले</option>
                            </select>
                            <br><br>
                            <label for="style">दागिन्याचा प्रकार :</label>
                            <select name="style" id="style">
                                <option value="" disabled selected>Select style</option>
                            </select>
                            <br><br>
                            <label for="goldSource">सोन:</label>
                            <label for="Client" style="display: inline-flex; align-items: center;">
                                <input type="radio" id="client" name="goldSource" value="Client" style="margin-right: 5px;">व्यापारी
                            </label>
                            <label for="own" style="display: inline-flex; align-items: center;">
                                <input type="radio" id="own" name="goldSource" value="Own" style="margin-right: 5px;">स्वतःचे
                            </label>
                            <br><br>
                            <label for="wastage">वेस्टेज (%):</label>
                            <input type="number" id="wastage" name="wastage" min="0" step="0.01" writingsuggestions="true" required>
                            <br><br>
                            <label for="purity">प्युरिटी:</label>
                            <input type="number" id="purity" name="purity" min="0" step="0.01" writingsuggestions="true" required>
                            <br><br>
                            <label for="weight">वजन(grams):</label>
                            <input type="number" id="weight" name="weight" min="0" step="0.01" writingsuggestions="true" required>
                            <label for="netWeight">फाईन(grams):</label>
                            <input type="number" id="netWeight" name="netWeight" min="0" step="0.01" writingsuggestions="true" required readonly>
                            <label for="profit">Profit (grams):</label>
                            <input type="number" id="profit" name="profit" min="0" step="0.01" writingsuggestions="true" required readonly>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>

                <!-- Modal Structure for New Customer -->
                <button id="toggleCustomerForm" class="btn btn-primary"
                        style="outline: none; width: 100px; border: 2px solid rgb(0, 0, 0); box-shadow: none; border-radius: 5px; background-color: transparent; margin-top: 0px;">
                    <img src="img/customer.png" alt="Logo" width="80px" height="100" style="border: none;">
                </button>
                <h6 style="margin-top: -10px;"> + नवीन व्यापारी</h6>
                <div id="customerFormModal" class="modal">
                    <div class="modal-content">
                        <span id="closeCustomerModal" class="close">&times;</span>
                        <form id="customerForm">
                            <h2>+ नवीन व्यापारी</h2>
                            <label for="newClientName">व्यापार्याचे नाव:</label>
                            <input type="text" id="newClientName" name="newClientName" writingsuggestions="true" required>
                            <label for="location">शहर:</label>
                            <input type="text" id="location" name="location" writingsuggestions="true" required>
                            <br><br>
                            <button type="submit" class="btn btn-success">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="data-container">
                <div class="item">
                    <h6>जमा सोने</h6>
                    <span id="savedGoldValue" class="value-box">0</span>
                </div>
                <div class="item">
                    <h6>सोने येणे बाकी</h6>
                    <span id="pendingGoldValue" class="value-box">0</span>
                </div>
                <div class="item">
                    <h6> पैसे येणे बाकी </h6>
                    <span id="pendingMoneyValue" class="value-box">0</span>
                </div>
            </div>
        </div>
        <!-- To-Do List Section -->
        <div class="todo-container">
            <h6>To-Do List</h6>
            <form id="todoForm">
                <input type="text" id="todoInput" placeholder="Add..." required>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>
            <ul id="todoList"></ul>
        </div>
    </main>
</div>
<script src="js/index.js" defer></script>
</body>
</html>
