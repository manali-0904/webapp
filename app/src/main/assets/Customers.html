<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>व्यापारी</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>
<body>
    <header>
        <h1>व्यापारी</h1>
    </header>
    <div class="container">
        <button id="sidebarbtn" class="openbtn" >☰</button>
        <!-- Sidebar Section -->
        <aside class="sidebar" id="sidebar">
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> सुवर्णकार डायरी</a></li>
                <li><a href="Customers.html"><i class="fa-solid fa-users"></i>व्यापारी</a></li>
                <li><a href="savegold.html"><i class="fas fa-store"></i> जमा सोने </a></li>
                <li><a href="pending gold.html"><i class="fas fa-hand-holding-usd"></i> सोने येणे बाकी </a></li>
                <li><a href="pending money.html"><i class="fas fa-cash-register"></i> पैसे येणे बाकी </a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="header-container">
            <h2>व्यापार्याचे नाव</h2>
                <input type="text" id="searchBar" oninput="filterClients()" placeholder="Search clients...">
            </div>
                <table id="customerTable" class="table-bordered" style="width: 500px">
                <thead>
                    <tr>
                        <th style="width: 30px;">#</th>
                        <th style="width: 100px;">व्यापार्याचे नाव</th>
                        <th style="width: 70px;">शहर</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Customer rows will be populated here -->
                </tbody>
            </table>
            <datalist id="clientNames">
                <!-- Datalist options will be populated here -->
            </datalist>

            <!-- Modal Structure for Customer Data -->
            <div id="customerDataModal" class="modal">
                <div class="modal-content">
                    <span class="close" id="closeCustomerDataModal">&times;</span>
                    <div id="customerDataContent">
                        <!-- Customer data will be displayed here -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src=js/customers.js></script>
</body>
</html>
